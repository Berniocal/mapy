<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6f8">
<title>Slepé mapy</title>
<link rel="stylesheet" href="styles.css?v=30">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="top-left">
      <button id="drawerBtn" class="icon-btn hidden" type="button" aria-label="Otevřít seznam">☰</button>
      <div>
        <div id="appTitle" class="app-title">Slepé mapy</div>
        <div id="subTitle" class="app-subtitle"></div>
      </div>
    </div>
    <div class="top-right">
      <span id="progress" class="stat">0 / 0</span>
      <span id="score" class="stat">Správně: 0</span>
      <button id="settingsBtn" type="button">Výběr</button>
      <button id="prevBtn" type="button" disabled>←</button>
      <button id="nextBtn" class="primary" type="button" disabled>Další</button>
    </div>
  </header>

  <div id="feedback" class="feedback"></div>

  <main id="mapWrap" class="map-wrap">
    <svg id="mapSvg" aria-label="Slepá mapa"></svg>

    <div class="map-tools">
      <button id="zoomIn" type="button" title="Přiblížit">+</button>
      <button id="zoomOut" type="button" title="Oddálit">−</button>
      <button id="resetView" type="button" title="Výchozí pohled">⌂</button>
      <button id="riverToggle" type="button" class="river-btn" title="Zobrazit / skrýt řeky">≋</button>
      <div id="zoomLevel" class="zoom-level">1×</div>
    </div>

    <div id="drawerScrim" class="drawer-scrim hidden"></div>
    <aside id="sideDrawer" class="side-drawer hidden">
      <div class="drawer-head">
        <strong id="drawerTitle">Pojmy</strong>
        <button id="drawerClose" class="icon-btn" type="button">×</button>
      </div>
      <div id="learnPanel" class="drawer-section hidden">
        <input id="learnSearch" class="search" type="search" placeholder="Hledat pojem…">
        <div id="learnCount" class="drawer-note"></div>
        <div id="learnList" class="learn-list"></div>
      </div>
      <div id="historyPanel" class="drawer-section hidden">
        <div id="historyList" class="history-list"></div>
      </div>
    </aside>

    <div id="startScreen" class="overlay hidden">
      <section class="panel start-panel">
        <h1>Vyber mapu</h1>

        <div class="button-grid two">
          <button class="choice-btn active" data-continent="eu" type="button">Evropa</button>
          <button class="choice-btn" data-continent="asia" type="button">Asie</button>
        </div>

        <div class="button-grid two">
          <button class="choice-btn active" data-mode="quiz" type="button">Procvičování</button>
          <button class="choice-btn" data-mode="learn" type="button">Prohlížení</button>
        </div>

        <div id="levelRow" class="button-grid two">
          <button class="choice-btn active" data-level="1" type="button">Základ</button>
          <button class="choice-btn" data-level="2" type="button">Rozšířené</button>
        </div>

        <div class="section-head">
          <strong>Okruhy</strong>
          <div class="mini-actions">
            <button id="allCats" type="button">Vše</button>
            <button id="noCats" type="button">Nic</button>
          </div>
        </div>

        <div id="categorySelectors" class="category-selectors"></div>

        <div id="quizCountRow" class="setting-row">
          <span>Počet otázek</span>
          <select id="count">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="30">30</option>
            <option value="50">50</option>
            <option value="all">Všechny</option>
          </select>
        </div>

        <details class="custom-box">
          <summary>Vlastní pojmy</summary>
          <div class="custom-tools">
            <button id="addTermBtn" type="button">＋ Přidat pojem</button>
            <button id="exportTermsBtn" type="button">Export</button>
            <label class="file-btn">Import
              <input id="importTermsInput" type="file" accept=".json,application/json" hidden>
            </label>
          </div>
        </details>

        <button id="startBtn" class="primary start-btn" type="button" disabled>Spustit</button>
      </section>
    </div>

    <div id="endScreen" class="overlay hidden">
      <section class="panel end-panel">
        <h2>Hotovo</h2>
        <div id="finalScore" class="big-score"></div>
        <div id="finalText" class="muted"></div>
        <div class="button-grid two">
          <button id="againBtn" class="primary" type="button">Znovu</button>
          <button id="endSettingsBtn" type="button">Výběr</button>
        </div>
      </section>
    </div>

    <div id="addTermScreen" class="overlay hidden">
      <section class="panel">
        <h2>Přidat pojem</h2>
        <div id="pickedPositionText" class="muted">Klikni nejdřív do mapy.</div>
        <div class="form-grid">
          <label>Název
            <input id="newTermName" type="text" autocomplete="off">
          </label>
          <label>Skupina
            <select id="newTermCategory">
              <option value="pen">Poloostrovy</option>
              <option value="isl">Ostrovy a souostroví</option>
              <option value="sea">Moře, zálivy a průlivy</option>
              <option value="des">Pouště</option>
              <option value="low">Nížiny</option>
              <option value="mnt">Pohoří a vysočiny</option>
            </select>
          </label>
          <label>Tolerance
            <div class="radius-row">
              <input id="newTermRadius" type="number" min="10" max="1000" step="10" value="100">
              <span>km</span>
            </div>
          </label>
        </div>
        <div class="button-grid two">
          <button id="saveTermBtn" class="primary" type="button">Uložit</button>
          <button id="cancelTermBtn" type="button">Zrušit</button>
        </div>
      </section>
    </div>

    <div id="loading" class="loading">
      <div class="loading-box">
        <div class="loading-title">Načítám mapy</div>
        <div class="loading-track"><div id="loadingBar" class="loading-bar"></div></div>
        <div id="loadingPercent" class="loading-percent">0 %</div>
      </div>
    </div>

    <div class="map-credit">Natural Earth · world-atlas</div>
  </main>
</div>

<script id="embeddedCustomTerms" type="application/json">[]</script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="europe-data.js?v=30"></script>
<script src="asia-data.js?v=30"></script>
<script src="europe-extra-data.js?v=30"></script>
<script src="app.js?v=30"></script>
</body>
</html>
