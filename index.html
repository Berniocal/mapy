<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Slepé mapy</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --text:#15171b; --muted:#667085;
  --line:#d8dde5; --land:#e8ebef; --coast:#30343b; --sea:#dfeef7;
  --accent:#2457d6; --good:#157347; --bad:#b42318;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{background:#fff;border-bottom:1px solid var(--line);padding:9px 13px;display:grid;gap:7px;z-index:10}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;min-width:0}
.title{font-size:17px;font-weight:800;white-space:nowrap}
.stats{font-size:13px;color:var(--muted);display:flex;gap:12px;white-space:nowrap}
.question-wrap{min-width:0}
.header-actions{display:flex;gap:7px;align-items:center;flex:0 0 auto}
.question{font-size:20px;line-height:1.1;font-weight:850;overflow-wrap:anywhere}
.category{font-size:12px;color:var(--muted);font-weight:650;margin-top:3px}
button,select{font:inherit;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);min-height:40px;padding:7px 11px}
button{font-weight:750;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:default}
.feedback{display:none;border-radius:10px;padding:7px 10px;font-size:14px;line-height:1.25;border:1px solid transparent}
.feedback.good{display:block;color:#05603a;background:#ecfdf3;border-color:#abefc6}
.feedback.bad{display:block;color:#912018;background:#fef3f2;border-color:#fecdca}
.feedback.neutral{display:block;color:#344054;background:#f2f4f7;border-color:#eaecf0}

.map-wrap{position:relative;min-height:0;background:var(--sea);overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent}
#mapSvg{display:block;width:100%;height:100%;cursor:crosshair;user-select:none;-webkit-user-select:none}
.country{fill:var(--land);stroke:none}
.borders{fill:none;stroke:#8d96a3;stroke-width:.65;vector-effect:non-scaling-stroke;pointer-events:none}
.coast{fill:none;stroke:var(--coast);stroke-width:1.15;vector-effect:non-scaling-stroke;pointer-events:none}
.answer-area{fill:rgba(21,115,71,.30);stroke:var(--good);stroke-width:1.8;vector-effect:non-scaling-stroke;pointer-events:none}
.tolerance-area{fill:rgba(21,115,71,.045);stroke:rgba(21,115,71,.72);stroke-width:1.3;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:none}
.answer-dot{fill:var(--good);stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none}
.guess-dot{fill:var(--bad);stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none}
.answer-line{fill:none;stroke:var(--bad);stroke-width:2.5;vector-effect:non-scaling-stroke;pointer-events:none}
.answer-line.ok{stroke:var(--good)}
.answer-label{font:700 11px system-ui,sans-serif;fill:#111;stroke:#fff;stroke-width:3;paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.map-note{position:absolute;left:9px;bottom:7px;font-size:10px;color:#5b6470;background:rgba(255,255,255,.78);padding:3px 6px;border-radius:6px;pointer-events:none}
.map-tools{position:absolute;right:10px;top:10px;display:grid;gap:5px}
.map-tools button{width:42px;height:42px;padding:0;font-size:20px;background:rgba(255,255,255,.94);box-shadow:0 1px 5px rgba(0,0,0,.12)}
.loading{
  position:absolute;inset:0;z-index:100;
  display:grid;place-items:center;
  background:#f7f9fb;color:var(--text);
}
.loading-box{width:min(360px,78vw);display:grid;gap:12px;text-align:center}
.loading-title{font-size:20px;font-weight:850}
.loading-track{height:6px;border-radius:999px;background:#e3e7ed;overflow:hidden}
.loading-bar{height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .12s linear}
.loading-percent{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.loading.error{padding:25px;text-align:center;color:#912018}

.overlay{position:absolute;z-index:30;inset:0;display:grid;place-items:center;padding:18px;background:rgba(244,246,248,.92);backdrop-filter:blur(4px)}
.overlay.hidden{display:none}
.panel{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 14px 38px rgba(16,24,40,.13)}
.panel h1{font-size:24px;margin:0 0 8px}
.panel p{margin:0 0 17px;color:var(--muted);line-height:1.45}
.settings{display:grid;gap:12px}
.continent-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.continent-btn{
  min-height:52px;border:1px solid var(--line);background:#f8f9fb;
  font-size:17px;font-weight:850;border-radius:12px;
}
.continent-btn.active{
  background:var(--accent);border-color:var(--accent);color:#fff;
  box-shadow:0 4px 12px rgba(36,87,214,.18)
}
.simple-label{font-size:12px;color:var(--muted);font-weight:750;margin-bottom:-4px}
.checks{display:grid;gap:8px}
.check{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fafafa;cursor:pointer}
.check input{width:19px;height:19px}
.settingline{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.hint{font-size:12px;color:var(--muted);margin-top:10px}

.category-selectors{display:grid;gap:8px}
.term-group{border:1px solid var(--line);border-radius:11px;background:#fafafa;overflow:hidden}
.term-group summary{
  list-style:none;display:flex;align-items:center;gap:9px;
  min-height:44px;padding:9px 11px;cursor:pointer;font-weight:800;
}
.term-group summary::-webkit-details-marker{display:none}
.term-group summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .15s}
.term-group:not([open]) summary::after{transform:rotate(-90deg)}
.term-group summary input{width:19px;height:19px;flex:0 0 auto}
.term-count{font-size:11px;color:var(--muted);font-weight:650;margin-left:4px}
.term-list{display:grid;gap:2px;padding:3px 8px 9px 35px;border-top:1px solid #eceff3;background:#fff}
.term-item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;min-height:34px;font-size:13px}
.term-item input{width:17px;height:17px}
.delete-term{
  min-height:28px!important;height:28px;padding:0 8px!important;
  border-radius:8px!important;color:#912018;font-size:13px;font-weight:800;
}
.custom-tools{display:grid;gap:7px;padding-top:2px}
.custom-actions{display:flex;gap:7px;flex-wrap:wrap}
.smallbtn{min-height:34px!important;padding:5px 9px!important;font-size:12px!important;font-weight:700!important}
.filebtn{
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text)
}
.formgrid{display:grid;gap:12px}
.formgrid label{display:grid;gap:5px;font-size:13px;font-weight:750}
.formgrid input,.formgrid select{width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;background:#fff}
.tolerance-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}

.end{text-align:center}
.bigscore{font-size:42px;font-weight:850;margin:9px 0}
.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
@media(max-width:650px){
  body{overflow:hidden}
  header{padding:7px 8px;gap:5px}
  .row{gap:7px}
  .title{font-size:13px}
  .stats{font-size:10px;gap:6px}
  .question{font-size:17px;line-height:1.05}
  .category{font-size:11px}
  .header-actions{gap:5px}
  #backBtn{min-height:38px;padding:6px 8px;font-size:12px}
  #nextBtn{min-width:68px;min-height:38px;padding:6px 9px}
  .feedback{font-size:12px;padding:6px 8px}
  .panel{padding:15px;border-radius:14px;max-height:94vh}
  .panel h1{font-size:20px;margin-bottom:12px}
  .continent-btn{min-height:48px;font-size:16px}
  .term-group summary{min-height:42px;padding:8px 10px}
  .term-list{padding-left:28px}
  .term-item{font-size:12px}
  .check{padding:9px 10px}
  .map-tools{right:7px;top:7px;gap:4px}
  .map-tools button{width:38px;height:38px;font-size:18px}
  .map-note{left:6px;bottom:5px;font-size:9px}
}
@media(max-width:390px){
  .answer-label{font-size:10px}
  .title{font-size:12px}
  .stats{font-size:9px}
  .question{font-size:16px}
  #backBtn{font-size:11px;padding:5px 6px}
  #nextBtn{min-width:62px;padding:5px 7px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="row">
    <div id="appTitle" class="title">Slepá mapa – klikni do mapy</div>
    <div class="stats"><span id="progress">0 / 0</span><span id="score">Správně: 0</span></div>
  </div>
  <div class="row">
    <div class="question-wrap">
      <div id="question" class="question">Načítám mapu…</div>
      <div id="category" class="category"></div>
    </div>
    <div class="header-actions">
      <button id="backBtn" type="button">Zpět na výběr</button>
      <button id="nextBtn" class="primary" disabled>Další</button>
    </div>
  </div>
  <div id="feedback" class="feedback"></div>
</header>

<div class="map-wrap" id="mapWrap">
  <svg id="mapSvg" aria-label="Slepá mapa"></svg>
  <div id="loading" class="loading">
    <div class="loading-box">
      <div class="loading-title">Načítám mapy</div>
      <div class="loading-track"><div id="loadingBar" class="loading-bar"></div></div>
      <div id="loadingPercent" class="loading-percent">0 %</div>
    </div>
  </div>
  <div class="map-tools">
    <button id="zoomIn" title="Přiblížit">+</button>
    <button id="zoomOut" title="Oddálit">−</button>
    <button id="resetView" title="Výchozí pohled">⌂</button>
    <div id="zoomLevel" style="text-align:center;font-size:10px;color:#5b6470;background:rgba(255,255,255,.9);border-radius:7px;padding:3px 2px">1×</div>
  </div>
  <div class="map-note">Natural Earth / world-atlas · bez API klíče</div>

  <div id="startScreen" class="overlay hidden">
    <div class="panel">
      <h1 id="startTitle">Vyber mapu</h1>
      <div class="settings">
        <div class="continent-buttons" id="continentButtons">
          <button type="button" class="continent-btn active" data-continent="eu">Evropa</button>
          <button type="button" class="continent-btn" data-continent="asia">Asie</button>
        </div>
        <div id="categorySelectors" class="category-selectors"></div>
        <div class="settingline">
          <span class="simple-label">Počet otázek</span>
          <select id="count">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="30">30</option>
            <option value="all">Všechny vybrané</option>
          </select>
        </div>

        <div class="custom-tools">
          <button id="addTermBtn" type="button">＋ Přidat pojem</button>
          <div class="custom-actions">
            <button id="downloadHtmlBtn" type="button" class="smallbtn">Stáhnout HTML</button>
            <button id="exportTermsBtn" type="button" class="smallbtn">Export</button>
            <label class="smallbtn filebtn">Import
              <input id="importTermsInput" type="file" accept=".json,application/json" hidden>
            </label>
          </div>
        </div>

        <button id="startBtn" class="primary" disabled>Spustit</button>
      </div>
    </div>
  </div>

  <div id="endScreen" class="overlay hidden">
    <div class="panel end">
      <h2>Hotovo</h2>
      <div id="finalScore" class="bigscore"></div>
      <div id="finalText" style="color:var(--muted);margin-bottom:18px"></div>
      <div class="actions">
        <button id="againBtn" class="primary">Hrát znovu</button>
        <button id="settingsBtn">Změnit nastavení</button>
      </div>
    </div>
  </div>

  <div id="addTermScreen" class="overlay hidden">
    <div class="panel">
      <h2 style="margin-top:0">Přidat vlastní pojem</h2>
      <p id="pickedPositionText">Poloha byla vybrána v mapě.</p>
      <div class="formgrid">
        <label>Název
          <input id="newTermName" type="text" placeholder="např. Bornholm" autocomplete="off">
        </label>
        <label>Skupina
          <select id="newTermCategory">
            <option value="pen">Poloostrovy</option>
            <option value="isl">Ostrovy a souostroví</option>
            <option value="sea">Moře, zálivy a průlivy</option>
            <option value="des">Pouště</option>
            <option value="low">Nížiny</option>
            <option value="mnt">Pohoří a vysočiny</option>
          </select>
        </label>
        <label>Tolerance
          <div class="tolerance-row">
            <input id="newTermRadius" type="number" min="10" max="1000" step="10" value="100">
            <span>km</span>
          </div>
        </label>
      </div>
      <div class="actions" style="margin-top:16px">
        <button id="saveTermBtn" class="primary">Uložit pojem</button>
        <button id="cancelTermBtn">Zrušit</button>
      </div>
    </div>
  </div>
</div>
</div>

<script id="embeddedCustomTerms" type="application/json">[]</script>

function normalizeCustomTerms(arr){
  if(!Array.isArray(arr))return [];
  return arr.filter(t =>
    t && typeof t.n==="string" &&
    ["pen","isl","sea","des","low","mnt"].includes(t.c) &&
    Number.isFinite(+t.lat) && Number.isFinite(+t.lon) && Number.isFinite(+t.r)
  ).map(t=>({
    id:t.id||("custom-"+Date.now()+"-"+Math.random().toString(36).slice(2)),
    n:t.n.trim(),c:t.c,lat:+t.lat,lon:+t.lon,r:+t.r,ct:(t.ct==="asia"?"asia":"eu"),custom:true
  }));
}

}

const targetGeometryCache=new Map();
const targetSampleCache=new Map();

function ringSignedArea(coords){
  let a=0;
  for(let i=0;i<coords.length-1;i++){
    const [x1,y1]=coords[i], [x2,y2]=coords[i+1];
    a+=x1*y2-x2*y1;
  }
  return a/2;
}

function normalizedRing(coords){
  const ring=coords.map(p=>[+p[0],+p[1]]);
  if(ring.length && (ring[0][0]!==ring[ring.length-1][0] || ring[0][1]!==ring[ring.length-1][1])){
    ring.push([...ring[0]]);
  }
  // D3 očekává vnější prstenec po směru hodinových ručiček.
  if(ringSignedArea(ring)>0)ring.reverse();
  return ring;
}

function pointInRing(lon,lat,coords){
  let inside=false;
  for(let i=0,j=coords.length-1;i<coords.length;j=i++){
    const xi=coords[i][0], yi=coords[i][1];
    const xj=coords[j][0], yj=coords[j][1];
    const crosses=((yi>lat)!==(yj>lat)) &&
      (lon < (xj-xi)*(lat-yi)/((yj-yi)||1e-12)+xi);
    if(crosses)inside=!inside;
  }
  return inside;
}

function geoPolygon(coords){
  return {type:"Polygon",coordinates:[normalizedRing(coords)]};
}

function geoCircleKm(lon,lat,rKm){
  return d3.geoCircle().center([lon,lat]).radius(rKm/111.195).precision(4)();
}

let landComponents=[];

function buildLandComponents(){
  landComponents=[];
  if(!countriesFeature?.features)return;
  for(const f of countriesFeature.features){
    const g=f.geometry;
    if(!g)continue;
    if(g.type==="Polygon"){
      const part={type:"Feature",properties:{country:f.properties?.name||""},geometry:g};
      landComponents.push({feature:part,centroid:d3.geoCentroid(part)});
    }else if(g.type==="MultiPolygon"){
      for(const poly of g.coordinates||[]){
        const part={type:"Feature",properties:{country:f.properties?.name||""},geometry:{type:"Polygon",coordinates:poly}};
        landComponents.push({feature:part,centroid:d3.geoCentroid(part)});
      }
    }
  }
}

function islandGeometryInsideRegion(region){
  const hits=[];
  for(const item of landComponents){
    const c=item.centroid;
    if(Number.isFinite(c?.[0]) && Number.isFinite(c?.[1]) && d3.geoContains(region,c)){
      hits.push(item.feature);
    }
  }
  return hits.length ? {type:"FeatureCollection",features:hits} : null;
}

function targetInfo(t){
  const key=t.id||t.n;
  if(targetGeometryCache.has(key))return targetGeometryCache.get(key);

  let info;
  if(t.custom){
    info={geometry:geoCircleKm(t.lon,t.lat,t.r),mode:"custom",source:"custom"};
  }else{
    const spec=TARGET_REGIONS[t.n];
    if(!spec){
      const region=geoCircleKm(t.lon,t.lat,Math.max(20,t.r));
      if(t.c==="isl"){
        const islands=islandGeometryInsideRegion(region);
        info=islands
          ? {geometry:islands,region,mode:t.c,source:"island-components"}
          : {geometry:region,region,mode:t.c,source:"fallback"};
      }else{
        info={geometry:region,region,mode:t.c,source:"fallback"};
      }
    }else{
      const region=geoPolygon(spec.coords);
      if(t.c==="isl"){
        // U ostrovů vezmeme skutečné pevninské komponenty, jejichž středy leží
        // v ručně ověřené oblasti. Tím se neobarví sousední pevnina.
        const islands=islandGeometryInsideRegion(region);
        info=islands
          ? {geometry:islands,region,mode:spec.mode||t.c,source:"island-components"}
          : {geometry:region,region,mode:spec.mode||t.c,source:"island-fallback"};
      }else{
        info={geometry:region,region,mode:spec.mode||t.c,source:"manual"};
      }
    }
  }
  targetGeometryCache.set(key,info);
  return info;
}

function isLandPoint(lon,lat){
  return !!countriesFeature && d3.geoContains(countriesFeature,[lon,lat]);
}

function insideCoreTarget(t,lon,lat){
  const info=targetInfo(t);

  if(t.custom){
    return d3.geoContains(info.geometry,[lon,lat]);
  }

  const spec=TARGET_REGIONS[t.n];
  const inManualRegion=spec ? pointInRing(lon,lat,spec.coords) : d3.geoContains(info.geometry,[lon,lat]);

  if(t.c==="pen"){
    return inManualRegion && isLandPoint(lon,lat);
  }

  if(t.c==="isl"){
    if(info.source==="island-components"){
      return d3.geoContains(info.geometry,[lon,lat]);
    }
    return inManualRegion && isLandPoint(lon,lat);
  }

  if(t.c==="sea"){
    if(!inManualRegion)return false;
    if(info.mode==="narrow")return true;
    return !isLandPoint(lon,lat);
  }

  // Ostatní tematické oblasti (pouště, nížiny, pohoří) používají běžnou geometrii cíle.
  return d3.geoContains(info.geometry,[lon,lat]);
}

function acceptedClick(t,lon,lat){
  const core=insideCoreTarget(t,lon,lat);
  if(core)return {ok:true,insideCore:true};

  if(t.custom){
    return {ok:haversine(lat,lon,t.lat,t.lon)<=t.r,insideCore:false};
  }

  // Tolerance mimo útvar je jen u menších ostrovů/souostroví.
  if(t.c==="isl" && SMALL_ISLAND_TOLERANCE.has(t.n)){
    return {ok:haversine(lat,lon,t.lat,t.lon)<=t.r,insideCore:false};
  }
  return {ok:false,insideCore:false};
}

function collectOuterRings(obj,out=[]){
  if(!obj)return out;
  if(obj.type==="FeatureCollection"){
    for(const f of obj.features||[])collectOuterRings(f,out);
  }else if(obj.type==="Feature"){
    collectOuterRings(obj.geometry,out);
  }else if(obj.type==="GeometryCollection"){
    for(const g of obj.geometries||[])collectOuterRings(g,out);
  }else if(obj.type==="Polygon"){
    if(obj.coordinates?.[0])out.push(obj.coordinates[0]);
  }else if(obj.type==="MultiPolygon"){
    for(const poly of obj.coordinates||[])if(poly?.[0])out.push(poly[0]);
  }
  return out;
}

function densifyRing(ring,maxPerEdge=8){
  const out=[];
  if(!ring?.length)return out;
  for(let i=0;i<ring.length-1;i++){
    const a=ring[i],b=ring[i+1];
    const span=Math.max(Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]));
    const n=Math.max(1,Math.min(maxPerEdge,Math.ceil(span/0.22)));
    for(let k=0;k<n;k++){
      const f=k/n;
      out.push([a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]);
    }
  }
  out.push(ring[ring.length-1]);
  return out;
}

function targetBoundarySamples(t){
  const key=t.id||t.n;
  if(targetSampleCache.has(key))return targetSampleCache.get(key);

  const info=targetInfo(t);
  let rings=[];

  if(!t.custom && TARGET_REGIONS[t.n] && t.c!=="isl"){
    // U ručně vymezených poloostrovů/moří používáme jen jejich hranici.
    rings=[normalizedRing(TARGET_REGIONS[t.n].coords)];
  }else{
    rings=collectOuterRings(info.geometry,[]);
  }

  let pts=[];
  for(const ring of rings)pts.push(...densifyRing(ring,8));

  // Omez počet bodů, aby jeden klik nikdy nezablokoval UI.
  const MAX=900;
  if(pts.length>MAX){
    const step=Math.ceil(pts.length/MAX);
    pts=pts.filter((_,i)=>i%step===0);
  }

  if(!pts.length)pts=[[t.lon,t.lat]];
  targetSampleCache.set(key,pts);
  return pts;
}

function nearestTargetPoint(t,lon,lat){
  if(insideCoreTarget(t,lon,lat))return {lon,lat,km:0};

  const pts=targetBoundarySamples(t);
  let best=Infinity,bestPoint=[t.lon,t.lat];

  for(const p of pts){
    const d=haversine(lat,lon,p[1],p[0]);
    if(d<best){
      best=d;
      bestPoint=p;
    }
  }

  if(!Number.isFinite(best)){
    best=haversine(lat,lon,t.lat,t.lon);
    bestPoint=[t.lon,t.lat];
  }
  return {lon:bestPoint[0],lat:bestPoint[1],km:best};
}

function distanceToTargetKm(t,lon,lat){
  return nearestTargetPoint(t,lon,lat).km;
}

function haversine(lat1,lon1,lat2,lon2){
  const R=6371.0088, rad=Math.PI/180;
  const p1=lat1*rad,p2=lat2*rad,dp=(lat2-lat1)*rad,dl=(lon2-lon1)*rad;
  const a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

  updateContinentButtons();
}

function updateContinentButtons(){
  document.querySelectorAll(".continent-btn").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.continent===currentContinent);
  });
}
function fmtKm(k){return k<10?k.toFixed(1).replace(".",",")+" km":Math.round(k).toLocaleString("cs-CZ")+" km"}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setFeedback(kind,text){feedbackEl.className="feedback "+kind;feedbackEl.textContent=text}
function clearFeedback(){feedbackEl.className="feedback";feedbackEl.textContent=""}
function clearAnswer(){answerWaterLayer.selectAll("*").remove();answerLandLayer.selectAll("*").remove();answerLayer.selectAll("*").remove();lastAnswer=null}

function sizeMap(){
  if(!countriesFeature)return;
  const el=document.getElementById("mapWrap");
  const w=Math.max(320,el.clientWidth),h=Math.max(320,el.clientHeight);
  svg.attr("viewBox",`0 0 ${w} ${h}`);
  projection=d3.geoMercator().fitExtent([[2,2],[w-2,h-2]],currentViewBox()).clipExtent([[0,0],[w,h]]);
  path=d3.geoPath(projection);
  drawBase();
  if(lastAnswer) renderAnswer();
  else clearAnswer();
}

function drawBase(){
  base.selectAll(".map-base").remove();
  const mapBase=base.append("g").attr("class","map-base");
  mapBase.selectAll("path.country")
    .data(countriesFeature.features)
    .join("path").attr("class","country").attr("d",path);
  mapBase.append("path").datum(countriesFeature).attr("class","coast").attr("d",path);
  mapBase.append("path").datum(bordersFeature).attr("class","borders").attr("d",path);

  // Ořez pro zvýraznění pevninských útvarů – zelená zůstane jen na pevnině.
  landClip.selectAll("*").remove();
  landClip.append("path").datum(countriesFeature).attr("d",path);
}

const zoom=d3.zoom()
  .scaleExtent([1,32])
  .filter(e => !locked || e.type==="wheel" || e.type==="mousedown" || e.type==="touchstart")
  .on("zoom",e=>{
    currentTransform=e.transform;
    mapLayer.attr("transform",currentTransform);
    const zl=document.getElementById("zoomLevel");
    if(zl)zl.textContent=(currentTransform.k<10?currentTransform.k.toFixed(1):Math.round(currentTransform.k))+"×";
    if(lastAnswer) renderAnswerOverlay();
  });
svg.call(zoom);

function resetView(animated=true){
  svg.interrupt();
  if(animated){
    svg.transition().duration(180).call(zoom.transform,d3.zoomIdentity);
  }else{
    svg.call(zoom.transform,d3.zoomIdentity);
  }
}
document.getElementById("zoomIn").onclick=()=>{svg.interrupt();svg.transition().duration(120).call(zoom.scaleBy,1.7)};
document.getElementById("zoomOut").onclick=()=>{svg.interrupt();svg.transition().duration(120).call(zoom.scaleBy,1/1.7)};
document.getElementById("resetView").onclick=()=>resetView();

function visibleTerms(){
  return allTerms().filter(t => ((t.ct||"eu")===currentContinent));
}

function renderTermSelectors(){
  const root=document.getElementById("categorySelectors");
  if(!root)return;

  const previous=new Set(
    [...root.querySelectorAll('input.term-check:checked')].map(x=>x.dataset.id)
  );
  const hadAny=root.querySelectorAll('input.term-check').length>0;

  const visible=visibleTerms();
  const cats=[...new Set(visible.map(t=>t.c))].sort((a,b)=>CATEGORY_ORDER.indexOf(a)-CATEGORY_ORDER.indexOf(b));

  root.innerHTML="";
  for(const cat of cats){
    const items=visible.filter(t=>t.c===cat);
    const details=document.createElement("details");
    details.className="term-group";
    details.open=false;

    const summary=document.createElement("summary");
    const master=document.createElement("input");
    master.type="checkbox";
    master.className="master-check";
    master.dataset.cat=cat;
    master.checked=true;

    const title=document.createElement("span");
    title.textContent=CAT_NAMES[cat];

    const count=document.createElement("span");
    count.className="term-count";
    count.textContent=`${items.length}`;

    summary.append(master,title,count);
    details.appendChild(summary);

    const list=document.createElement("div");
    list.className="term-list";

    for(const t of items){
      const row=document.createElement("label");
      row.className="term-item";

      const cb=document.createElement("input");
      cb.type="checkbox";
      cb.className="term-check";
      cb.dataset.id=t.id;
      cb.dataset.cat=cat;
      cb.checked=hadAny ? previous.has(t.id) : true;

      const name=document.createElement("span");
      name.textContent=t.n;

      row.append(cb,name);

      if(t.custom){
        const del=document.createElement("button");
        del.type="button";
        del.className="delete-term";
        del.textContent="×";
        del.title="Smazat vlastní pojem";
        del.addEventListener("click",e=>{
          e.preventDefault();e.stopPropagation();
          if(confirm(`Smazat vlastní pojem „${t.n}“?`)){
            customTerms=customTerms.filter(x=>x.id!==t.id);
            saveCustomTerms();
            renderTermSelectors();
          }
        });
        row.appendChild(del);
      }else{
        row.appendChild(document.createElement("span"));
      }
      list.appendChild(row);
    }

    details.appendChild(list);
    root.appendChild(details);

    const syncMaster=()=>{
      const cbs=[...list.querySelectorAll(".term-check")];
      const checked=cbs.filter(x=>x.checked).length;
      master.checked=checked===cbs.length && cbs.length>0;
      master.indeterminate=checked>0 && checked<cbs.length;
    };
    syncMaster();

    master.addEventListener("click",e=>e.stopPropagation());
    master.addEventListener("change",()=>{
      list.querySelectorAll(".term-check").forEach(cb=>cb.checked=master.checked);
      master.indeterminate=false;
    });
    list.addEventListener("change",syncMaster);

    summary.addEventListener("click",e=>{
      if(e.target===master) e.preventDefault();
    });
  }
}

function selectedTerms(){
  const ids=new Set(
    [...document.querySelectorAll("#categorySelectors .term-check:checked")].map(x=>x.dataset.id)
  );
  return visibleTerms().filter(t=>ids.has(t.id));
}
function startGame(){
  if(!ready)return;
  updateContinentTexts();
  svg.interrupt();
  addMode=false;
  pendingPosition=null;
  const pool=selectedTerms();
  if(!pool.length){alert("Vyber alespoň jeden pojem.");return}
  const raw=document.getElementById("count").value;
  const amount=raw==="all"?pool.length:Math.min(+raw,pool.length);
  queue=shuffle(pool).slice(0,amount);
  index=-1;correct=0;locked=true;
  scoreEl.textContent="Správně: 0";
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("endScreen").classList.add("hidden");
  resetView(false);
  showQuestion();
}
function showQuestion(){
  clearAnswer();clearFeedback();resetView(false);
  index++;
  if(index>=queue.length){finish();return}
  locked=false;nextBtn.disabled=true;
  const t=queue[index];
  qEl.textContent=t.n;catEl.textContent=CAT_NAMES[t.c];
  progEl.textContent=`${index+1} / ${queue.length}`;
  scoreEl.textContent=`Správně: ${correct}`;
}
function renderAnswerOverlay(){
  if(!lastAnswer)return;
  const {t,guess,ok,insideCore}=lastAnswer;
  answerLayer.selectAll("*").remove();

  const g0=projection([guess.lon,guess.lat]);
  const [gx,gy]=currentTransform.apply(g0);

  // Spojnice je vždy vidět. Při chybě míří k nejbližšímu přijatelnému bodu oblasti.
  const targetLinePoint=(ok&&insideCore)
    ? {lon:t.lon,lat:t.lat}
    : nearestTargetPoint(t,guess.lon,guess.lat);
  const lp0=projection([targetLinePoint.lon,targetLinePoint.lat]);
  const [lx,ly]=currentTransform.apply(lp0);

  answerLayer.append("line")
    .attr("class","answer-line"+(ok?" ok":""))
    .attr("x1",gx).attr("y1",gy)
    .attr("x2",lx).attr("y2",ly);

  answerLayer.append("circle")
    .attr("class","guess-dot")
    .attr("cx",gx).attr("cy",gy).attr("r",4);

  const a0=projection([t.lon,t.lat]);
  const [ax,ay]=currentTransform.apply(a0);
  answerLayer.append("text")
    .attr("class","answer-label")
    .attr("x",ax+7).attr("y",ay-7)
    .text(t.n);
}

function renderAnswer(){
  if(!lastAnswer)return;
  const {t}=lastAnswer;
  answerWaterLayer.selectAll("*").remove();
  answerLandLayer.selectAll("*").remove();

  const info=targetInfo(t);

  // U menších ostrovů ukážeme i povolenou toleranci mimo ostrov.
  if(!t.custom && t.c==="isl" && SMALL_ISLAND_TOLERANCE.has(t.n)){
    answerLandLayer.append("path")
      .datum(geoCircleKm(t.lon,t.lat,t.r))
      .attr("class","tolerance-area")
      .attr("d",path);
  }

  if(t.custom){
    answerLandLayer.append("path")
      .datum(info.geometry)
      .attr("class","answer-area")
      .attr("d",path);
  }else if(t.c==="sea"){
    // Mořská zelená je pod vrstvou pevniny, takže se nikdy neobarví stát/ostrov.
    answerWaterLayer.append("path")
      .datum(info.geometry)
      .attr("class","answer-area")
      .attr("d",path);  }else if(t.c==="isl" && info.source==="island-components"){
    // Ostrov / souostroví: zvýrazní se skutečné pevninské části.
    answerLandLayer.append("path")
      .datum(info.geometry)
      .attr("class","answer-area")
      .attr("d",path);
  }else if(t.c==="pen"){
    // Poloostrovy: ruční hranice se ořízne přesnou pevninou z mapy.
    answerLandLayer.append("path")
      .datum(info.geometry)
      .attr("class","answer-area")
      .attr("clip-path","url(#landClip)")
      .attr("d",path);
  }else{
    // Ostatní tematické oblasti (pouště, nížiny, pohoří...) zobrazíme přímo.
    answerLandLayer.append("path")
      .datum(info.geometry)
      .attr("class","answer-area")
      .attr("d",path);
  }

  renderAnswerOverlay();
}

function reveal(t,guess,ok,insideCore,missKm){
  lastAnswer={t,guess,ok,insideCore,missKm};
  renderAnswer();

  if(ok && insideCore){
    setFeedback("good","Správně – klikl(a) jsi přímo do správné oblasti.");
  }else if(ok){
    setFeedback("good",`Správně – u malého ostrova se počítá i blízké okolí. Od ostrova jsi byl(a) přibližně ${fmtKm(missKm)}.`);
  }else{
    setFeedback("bad",`Mimo správnou oblast přibližně o ${fmtKm(missKm)}. Zeleně je označená celá správná oblast.`);
  }
}

svg.on("click",event=>{
  if(!ready||event.defaultPrevented)return;
  const pointer=d3.pointer(event,svg.node());
  const p=currentTransform.invert(pointer);
  const ll=projection.invert(p);
  if(!ll)return;
  const [lon,lat]=ll;
  if(!Number.isFinite(lat)||!Number.isFinite(lon)||lat<-85||lat>85)return;

  if(addMode){
    pendingPosition={lat,lon};
    addMode=false;
    locked=true;
    document.getElementById("pickedPositionText").textContent=
      `Vybraná poloha: ${lat.toFixed(2)}°, ${lon.toFixed(2)}°.`;
    document.getElementById("addTermScreen").classList.remove("hidden");
    qEl.textContent="Přidat vlastní pojem";
    catEl.textContent="Vyplň název, skupinu a toleranci.";
    setTimeout(()=>document.getElementById("newTermName").focus(),50);
    return;
  }

  if(locked||index<0||index>=queue.length)return;

  const t=queue[index];
  svg.style("cursor","wait");
  // Zamkneme až tuto konkrétní odpověď, ale "Další" vždy povolíme i při neočekávané chybě.
  locked=true;

  try{
    const result=acceptedClick(t,lon,lat);
    const missKm=result.insideCore ? 0 : distanceToTargetKm(t,lon,lat);

    if(result.ok)correct++;
    scoreEl.textContent=`Správně: ${correct}`;
    reveal(t,{lat,lon},result.ok,result.insideCore,missKm);
  }catch(err){
    console.error("Chyba při vyhodnocení odpovědi:",err);
    setFeedback("bad","Při vyhodnocení této položky nastala chyba. Můžeš pokračovat tlačítkem Další.");
    // Zobrazíme alespoň kliknutý bod, aby obrazovka nepůsobila zamrzle.
    answerLayer.selectAll("*").remove();
    const g0=projection([lon,lat]);
    const [gx,gy]=currentTransform.apply(g0);
    answerLayer.append("circle")
      .attr("class","guess-dot")
      .attr("cx",gx).attr("cy",gy).attr("r",4);
  }finally{
    svg.style("cursor","crosshair");
    nextBtn.disabled=false;
  }
});

nextBtn.onclick=showQuestion;

function finish(){
  locked=true;nextBtn.disabled=true;clearAnswer();
  const pct=queue.length?Math.round(correct/queue.length*100):0;
  document.getElementById("finalScore").textContent=`${correct} / ${queue.length}`;
  document.getElementById("finalText").textContent=`Úspěšnost ${pct} %.`;
  document.getElementById("endScreen").classList.remove("hidden");
}
window.addEventListener("resize",()=>{clearTimeout(window.__rt);window.__rt=setTimeout(sizeMap,100)});

async function getWorld(){
  const urls=[
    "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-10m.json",
    "https://unpkg.com/world-atlas@2/countries-10m.json",
    "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json",
    "https://unpkg.com/world-atlas@2/countries-50m.json"
  ];
  let lastErr;
  for(const url of urls){
    try{
      const r=await fetch(url,{mode:"cors"});
      if(!r.ok)throw new Error("HTTP "+r.status);
      return await r.json();
    }catch(e){lastErr=e}
  }
  throw lastErr||new Error("Mapová data se nepodařilo stáhnout.");
}

document.getElementById("importTermsInput").addEventListener("change",async e=>{
  const file=e.target.files?.[0];
  if(!file)return;
  try{
    const arr=JSON.parse(await file.text());
    if(!Array.isArray(arr))throw new Error();
    const imported=arr.filter(t =>
      t && typeof t.n==="string" &&
      ["pen","isl","sea","des","low","mnt"].includes(t.c) &&
      Number.isFinite(+t.lat) && Number.isFinite(+t.lon) && Number.isFinite(+t.r)
    ).map(t=>({
      id:"custom-"+Date.now()+"-"+Math.random().toString(36).slice(2),
      n:t.n.trim(),c:t.c,lat:+t.lat,lon:+t.lon,r:+t.r,ct:(t.ct==="asia"?"asia":currentContinent),custom:true
    }));
    customTerms=customTerms.concat(imported);
    saveCustomTerms();
    renderTermSelectors();
    alert(`Importováno: ${imported.length} pojmů.`);
  }catch(err){
    alert("Soubor se nepodařilo načíst jako platný export vlastních pojmů.");
  }finally{
    e.target.value="";
  }
});

function auditBuiltInTargets(){
  const rows=[];
  for(const t of TERMS){
    const spec=TARGET_REGIONS[t.n];
    let centerInRegion=false;
    let source="missing";
    let islandParts="";
    if(spec){
      const region=geoPolygon(spec.coords);
      centerInRegion=pointInRing(t.lon,t.lat,spec.coords);
      const info=targetInfo(t);
      source=info.source;
      if(t.c==="isl" && info.geometry?.type==="FeatureCollection") islandParts=info.geometry.features.length;
    }
    rows.push({pojem:t.n,kategorie:t.c,oblast:!!spec,stred:centerInRegion,zdroj:source,ostrovni_casti:islandParts});
  }
  const bad=rows.filter(r=>!r.oblast||!r.stred);
  if(bad.length)console.error("Audit mapy – problémové položky",bad);
  else console.info(`Audit mapy: ${rows.length}/${rows.length} vestavěných pojmů má vlastní oblast a správný střed.`);
  return {rows,bad};
}

  try{

    setLoadingTarget(70);
    countriesFeature=topojson.feature(world,world.objects.countries);
    bordersFeature=topojson.mesh(world,world.objects.countries,(a,b)=>a!==b);
    setLoadingTarget(82);
    buildLandComponents();
    targetGeometryCache.clear();
    targetSampleCache.clear();
    currentContinent="eu";
    updateContinentTexts();
    sizeMap();
    setLoadingTarget(92);
    ready=true;locked=true;
    renderTermSelectors();
    document.getElementById("startBtn").disabled=false;
    qEl.textContent="Vyber nastavení a spusť hru";
    finishLoading();
  }catch(e){
    console.error(e);
    clearInterval(loadingTimer);
    loading.className="loading error";
    loading.innerHTML="<div class=\"loading-box\"><div class=\"loading-title\">Mapy se nepodařilo načíst</div><button onclick=\"location.reload()\">Zkusit znovu</button></div>";
    qEl.textContent="Mapa se nenačetla";
  }
}
init();
